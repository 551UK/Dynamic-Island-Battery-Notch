name: Build and release rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: island-battery-notch-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Settings icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          png = base64.b64decode(Path('assets/DynamicIslandBatteryNotch.png.b64').read_text())
          for destination in ('layout/Library/PreferenceLoader/Preferences/IslandBatteryNotch.png', 'prefs/Resources/icon.png'):
              p = Path(destination)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(png)
          PY
          sips -z 29 29 layout/Library/PreferenceLoader/Preferences/IslandBatteryNotch.png >/dev/null
          sips -z 29 29 prefs/Resources/icon.png >/dev/null

      - name: Run source regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Compile rootless tweak
        run: make clean package FINALPACKAGE=1

      - name: Verify built package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.islandbatterynotch"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.23"
          root="$RUNNER_TEMP/island-notch-verify"
          ctrl="$RUNNER_TEMP/island-notch-control"
          mkdir -p "$root" "$ctrl"
          dpkg-deb -x "$deb" "$root"
          dpkg-deb -e "$deb" "$ctrl"
          test ! -e "$ctrl/postinst"
          test ! -e "$ctrl/prerm"
          test ! -e "$ctrl/postrm"
          dylib="$root/var/jb/Library/MobileSubstrate/DynamicLibraries/IslandBatteryNotch.dylib"
          tweak_filter="$root/var/jb/Library/MobileSubstrate/DynamicLibraries/IslandBatteryNotch.plist"
          prefs="$root/var/jb/Library/PreferenceBundles/IslandBatteryNotchPrefs.bundle"
          prefs_entry="$root/var/jb/Library/PreferenceLoader/Preferences/IslandBatteryNotch.plist"
          test -s "$dylib"
          test -s "$tweak_filter"
          test -s "$prefs/IslandBatteryNotchPrefs"
          test -s "$prefs/Root.plist"
          test -s "$prefs/Info.plist"
          test -s "$prefs/icon.png"
          icon="$root/var/jb/Library/PreferenceLoader/Preferences/IslandBatteryNotch.png"
          test -s "$icon"
          /usr/libexec/PlistBuddy -c 'Print :entry:icon' "$prefs_entry" | grep -Fx '/var/jb/Library/PreferenceLoader/Preferences/IslandBatteryNotch.png'
          /usr/libexec/PlistBuddy -c 'Print :entry:iconImage' "$prefs_entry" | grep -Fx '/var/jb/Library/PreferenceLoader/Preferences/IslandBatteryNotch.png'
          /usr/libexec/PlistBuddy -c 'Print :entry:label' "$prefs_entry" | grep -Fx 'Dynamic Island Battery Notch'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$prefs/Info.plist" | grep -Fx 'Dynamic Island Battery Notch'
          test "$(dpkg-deb -f "$deb" Name)" = "Dynamic Island Battery Notch"
          dpkg-deb -f "$deb" Description | grep -F 'Shows your battery level as a coloured line around the Dynamic Island'
          test "$(sips -g pixelWidth "$icon" | awk '/pixelWidth/{print $2}')" = 29
          test "$(sips -g pixelHeight "$icon" | awk '/pixelHeight/{print $2}')" = 29
          test "$(sips -g pixelWidth "$prefs/icon.png" | awk '/pixelWidth/{print $2}')" = 29
          test "$(sips -g pixelHeight "$prefs/icon.png" | awk '/pixelHeight/{print $2}')" = 29
          /usr/libexec/PlistBuddy -c "Print :NSPrincipalClass" "$prefs/Info.plist" | grep -Fx IBNRootListController
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$prefs/Info.plist" | grep -Fx IslandBatteryNotchPrefs
          test -s "$prefs_entry"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          xcrun lipo "$prefs/IslandBatteryNotchPrefs" -verify_arch arm64 arm64e
          plutil -lint "$prefs/Root.plist" "$prefs/Info.plist" "$prefs_entry" "$tweak_filter"
          echo "Rootless package and binary verification passed."

      - uses: actions/upload-artifact@v4
        with:
          name: IslandBatteryNotch-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish DEB to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.23 >/dev/null 2>&1; then
            gh release upload v0.2.23 packages/*.deb --clobber
          else
            gh release create v0.2.23 packages/*.deb --target "$GITHUB_SHA" --title "Dynamic Island Battery Notch v0.2.23" --notes "Updated Settings and Sileo name to Dynamic Island Battery Notch, added a working rootless Settings icon, a centred README title with grey 551UK credit and an easier-to-understand description. During active screen recording only, use 2pt extra clearance on the right curved end (previously 3pt), keeping it outside the black Island without moving the left. Set the recording-stop blackout to five seconds, three-second charging pause, pulse option, countdown and known-good Lock Screen geometry."
          fi

      - name: Remove legacy DEB assets older than v0.2.14
        # Keep tags, release descriptions, sources, and all v0.2.14+ assets.
        # This only removes .deb attachments from older v0.2.x releases.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases-for-cleanup.json"
          python3 - "$RUNNER_TEMP/releases-for-cleanup.json" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              pages = json.load(handle)
          repo = os.environ["GITHUB_REPOSITORY"]
          removed = []
          kept = []
          for page in pages:
              for release in page:
                  tag = release.get("tag_name", "")
                  match = re.fullmatch(r"v0[.]2[.](\d+)", tag)
                  if not match:
                      continue
                  old = int(match.group(1)) < 14
                  for asset in release.get("assets", []):
                      name = asset.get("name", "")
                      if not name.lower().endswith(".deb"):
                          continue
                      if old:
                          asset_id = int(asset["id"])
                          subprocess.run(["gh", "api", "-X", "DELETE",
                                          f"repos/{repo}/releases/assets/{asset_id}"],
                                         check=True)
                          removed.append(f"{tag}/{name}")
                      else:
                          kept.append(f"{tag}/{name}")
          print("Removed legacy DEBs:", json.dumps(removed))
          print("Preserved v0.2.14+ DEBs:", json.dumps(kept))
          PY
