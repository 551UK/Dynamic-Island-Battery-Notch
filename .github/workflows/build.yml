name: Build and release rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: island-battery-notch-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run source regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Compile rootless tweak
        run: make clean package FINALPACKAGE=1

      - name: Verify built package
        shell: bash
        run: |
          set -euo pipefail
          # dpkg-deb is installed on the Ubuntu runner.
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.islandbatterynotch"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.7"
          root="$RUNNER_TEMP/island-notch-verify"
          ctrl="$RUNNER_TEMP/island-notch-control"
          mkdir -p "$root" "$ctrl"
          dpkg-deb -x "$deb" "$root"
          dpkg-deb -e "$deb" "$ctrl"
          test ! -e "$ctrl/postinst"
          test ! -e "$ctrl/prerm"
          test ! -e "$ctrl/postrm"
          dylib="$root/var/jb/Library/MobileSubstrate/DynamicLibraries/IslandBatteryNotch.dylib"
          tweak_filter="$root/var/jb/Library/MobileSubstrate/DynamicLibraries/IslandBatteryNotch.plist"
          prefs="$root/var/jb/Library/PreferenceBundles/IslandBatteryNotchPrefs.bundle"
          prefs_entry="$root/var/jb/Library/PreferenceLoader/Preferences/IslandBatteryNotch.plist"
          test -s "$dylib"
          test -s "$tweak_filter"
          test -s "$prefs/IslandBatteryNotchPrefs"
          test -s "$prefs/Root.plist"
          test -s "$prefs/Info.plist"
          python3 - "$prefs/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          assert info.get("NSPrincipalClass") == "IBNRootListController"
          assert info.get("CFBundleExecutable") == "IslandBatteryNotchPrefs"
          PY
          test -s "$prefs_entry"
          # Verify both architectures and XML property lists on Linux.
          python3 - "$dylib" "$prefs/IslandBatteryNotchPrefs" "$prefs/Root.plist" "$prefs/Info.plist" "$prefs_entry" <<'PY'
          import pathlib
          import plistlib
          import struct
          import sys

          CPU_ARM64 = 0x0100000c
          for path in map(pathlib.Path, sys.argv[1:3]):
              binary = path.read_bytes()
              magic = binary[:4]
              archs = set()
              if magic in (bytes.fromhex("cafebabe"), bytes.fromhex("cafebabf")):
                  is64 = magic == bytes.fromhex("cafebabf")
                  n = struct.unpack_from(">I", binary, 4)[0]
                  stride = 32 if is64 else 20
                  for i in range(n):
                      cpu, subtype = struct.unpack_from(">II", binary, 8 + i * stride)
                      if cpu == CPU_ARM64:
                          archs.add(subtype & 0xff)
              elif magic in (bytes.fromhex("cffaedfe"), bytes.fromhex("feedfacf")):
                  order = "<" if magic == bytes.fromhex("cffaedfe") else ">"
                  cpu, subtype = struct.unpack_from(order + "II", binary, 4)
                  if cpu == CPU_ARM64:
                      archs.add(subtype & 0xff)
              assert 0 in archs, f"{path}: missing arm64 architecture: {archs}"
              assert 2 in archs, f"{path}: missing arm64e architecture: {archs}"
              print(f"{path}: arm64 + arm64e verified")
          for p in sys.argv[3:]:
              with open(p, "rb") as src:
                  plistlib.load(src)
              print(f"{p}: valid plist")
          PY
          grep -q 'com.apple.springboard' "$tweak_filter"
          echo "Rootless package and binary verification passed."

      - uses: actions/upload-artifact@v4
        with:
          name: IslandBatteryNotch-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish DEB to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.7 >/dev/null 2>&1; then
            gh release upload v0.2.7 packages/*.deb --clobber
          else
            gh release create v0.2.7 packages/*.deb --target "$GITHUB_SHA" --title "Island Battery Notch v0.2.7" --notes "Four-second delay before switching to custom charging colour, with instant colour restoration on unplug and v0.2.6 Safe Mode rollback preserved. Always-on Lock/Home/app overlay; symmetric 1% battery progression; red 0–20%, yellow 21–60%, green 61–100%. Install with Sileo then respring."
          fi
